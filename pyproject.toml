[project]
name = "dandori"
version = "0.1.0"
description = "Japanese instruction -> LLM planner -> VLA executor -> VLM verifier on LIBERO"
requires-python = ">=3.10"
dependencies = [
    "anthropic[vertex]>=1.0",
    "numpy",
    "pillow",
    "python-dotenv",
    "google-cloud-storage",
]

[project.optional-dependencies]
sim = ["imageio[ffmpeg]", "opencv-python-headless"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
